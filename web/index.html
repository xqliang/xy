<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#c8a068" />
    <title>悟空救我</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #c8a068;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game {
        background: linear-gradient(180deg, #f0e4c8 0%, #dec18e 38%, #d4b878 72%, #c8a068 100%);
        box-shadow: 0 0 40px rgba(255, 180, 80, 0.15);
        border-radius: 12px;
        max-width: 100vw;
        max-height: 100dvh;
        touch-action: none;
      }
      /* 手机浏览器：去圆角/阴影，画布尽量贴满可视区域 */
      @media (pointer: coarse) {
        body {
          padding: 0;
        }
        #game {
          border-radius: 0;
          box-shadow: none;
          max-width: none;
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- width/height 属性 = render.ts 的 VIEW_W/VIEW_H（逻辑分辨率），
         让浏览器在 JS 执行前就按正确宽高比撑满容器，避免默认 300x150 画布先小后大的闪烁。
         若后续调整 VIEW_W/VIEW_H 需同步改这里。 -->
    <canvas id="game" width="560" height="1044"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
